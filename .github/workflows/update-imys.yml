name: Update Imys calendar

on:
  schedule:
    # every 3 days at 02:00 UTC (10:00 Asia/Shanghai)
    - cron: "0 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dmm-imys.com blocks overseas datacenter IPs (CloudFront WAF, 403 on every
      # path including /news/feed/), so the runner cannot reach it directly.
      # We go through a Vercel function pinned to Tokyo (hnd1) instead.
      - name: Fetch imys feed via Tokyo proxy and rebuild ics
        run: >-
          python scripts/fetch_imys.py
          --base https://imys-feed-proxy-yoomm.vercel.app
          --pages 5
          --out aimis_jp.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aimis_jp.ics
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh aimis_jp.ics"
            git push
          fi
