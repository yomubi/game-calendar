name: Update Imys calendar

on:
  schedule:
    - cron: '0 2 * * *'   # 10:00 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch aimis news
        run: python scripts/fetch_imys.py --pages 4 --out aimis_jp.ics

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- aimis_jp.ics; then
            echo "no change"
            exit 0
          fi
          git add aimis_jp.ics
          git commit -m "chore: refresh aimis_jp.ics"
          git push
