name: probe2
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "== curl syndication =="
          curl -s -o /tmp/x.html -w "code=%{http_code} bytes=%{size_download}\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://syndication.twitter.com/srv/timeline-profile/screen-name/Aigis1000"
          echo "== python urllib syndication =="
          python - <<'EOF'
          import urllib.request
          req=urllib.request.Request("https://syndication.twitter.com/srv/timeline-profile/screen-name/Aigis1000",headers={"User-Agent":"Mozilla/5.0"})
          try:
              r=urllib.request.urlopen(req,timeout=30); print("py code",r.status,len(r.read()))
          except Exception as e: print("py err",e)
          EOF
          echo "== browndust2 官网 =="
          curl -s -o /tmp/bd.html -w "code=%{http_code} bytes=%{size_download}\n" "https://www.browndust2.com/"
          head -c 600 /tmp/bd.html
          echo ""
          echo "== bd2 可能的 news 路径 =="
          for p in /ja/news /ja/notice /news /notice /ja/information; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.browndust2.com$p")
            echo "  $p -> $code"
          done