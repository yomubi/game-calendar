name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          for u in \
            "https://monmusu-td.wikiru.jp/" \
            "https://scre.swiki.jp/" \
            "https://wikiwiki.jp/aigis/" \
            "https://seesaawiki.jp/aigis/" \
            "https://aigis1000.jp/" \
            "https://dmm-imys.com/news/" \
            "https://monmusu-td.jp/" \
            "https://www.browndust2.com/" \
          ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" --max-time 25 -L "$u")
            size=$(curl -s -o /dev/null -w "%{size_download}" -A "$UA" --max-time 25 -L "$u")
            echo "$code  ${size}B  $u"
          done
