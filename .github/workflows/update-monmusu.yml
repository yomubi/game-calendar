name: update monmusu calendar

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch events
        run: python scripts/fetch_monmusu.py --out monmusu_jp.ics

      - name: Commit if changed
        run: |
          git config user.name  "lumia-bot"
          git config user.email "lumia-bot@users.noreply.github.com"
          if git diff --quiet -- monmusu_jp.ics; then
            echo "no change"
            exit 0
          fi
          git add monmusu_jp.ics
          git commit -m "chore: refresh monmusu_jp.ics"
          git push
