name: Update FGO calendar

on:
  schedule:
    # every day at 01:00 UTC (09:00 Asia/Shanghai)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Mooncell data and rebuild ics
        run: python scripts/fetch_fgo.py --months 3 --out fgo_jp.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fgo_jp.ics
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh fgo_jp.ics"
            git push
          fi
