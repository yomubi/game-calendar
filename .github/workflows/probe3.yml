name: probe3
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe rss
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          for u in "https://dmm-imys.com/news/feed/" "https://dmm-imys.com/feed/" "https://dmm-imys.com/wp-json/wp/v2/news?per_page=3"; do
            code=$(curl -s -o /tmp/o -w "%{http_code}" -A "$UA" "$u")
            echo "$u -> $code $(wc -c < /tmp/o)B"
            head -c 200 /tmp/o; echo ""
          done